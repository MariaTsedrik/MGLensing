observable: '3x2pt'
#Observables 
#     'WL' -> shear-shear
#     'GC' -> photo-clustering
#     '3x2pt' -> 3x2pt: shear-shear, photo-clustering, galaxy-galaxy lensing


likelihood: 'binned'
#Likelihood
#      'determinants' -> using determinants and summing over all integer ell-values
#      'binned' -> using covariance and differences between data vectors

use_jax: false

specs:
  #Scale cuts
  #'const_lmax' -> same lmax in all z-bins
  #'lmax' -> vary lmax in each z-bin
  #'kmax' -> vary kmax in each z-bin, which technically equals to the 'lmax'-option via lmax=kmax rcom(z_mod)/(1+z_mod)
  #           with z_mod corresponding to a peak of the shear and photo-GC kernels 
  scale_cuts:
    type: 'const_lmax'
    max_WL: [2000] # for 'const_lmax' option
            
    max_GC: [750] # for 'const_lmax' option
    cosmo: # for transformation from k_eff to ell
      'Omega_m': 0.31
      'w0': -1.
      'wa': 0.

  #Survey info
  #     Euclid: Euclid_Y1, Euclid_5bins or Euclid_10bins
  #     LSST: LSST_Y1 or LSST_Y10 
  #----- not implemented yet:  
  #     Custom: analytical n(z) or from file
  survey_info: 'Euclid_5bins' #'Euclid_5bins' #'LSST_Y1' #'Euclid_Y1' #'Euclid_5bins'
  custom_survey_path: 


data:
  #add_noise: False
  type: 0
  #Types:
  #     0 -> compute for a given model and likelihood
  #----- not implemented yet:  
  #     1 -> read from a file
  data_file: 

  nl_model: 12
  #bacco_option: 'z_extrap_hmcode'
  #option: 'linear'
  #Nonlinear power spectrum
  #     0 -> HMcode
  #     1 -> bacco
  #     2 -> nDGP
  #     3 -> gLEMURS
  #     4 -> μ-Σ (Σ is not properly implemented in Cls yet)
  #     5 -> Dark Scattering (Interacting Dark Energy)
  #     6 -> f(R) with ReACT
  #     7 -> f(R) with eMANTIS
  #     8 -> nDGP with nDGPemu
  bias_model: 0
  # Photometric galaxy bias model (redshift dependence)
  #     0 -> constant linear bias within bins
  #     1 -> (b1, b2) constant within bins
  #     2 -> heft
  #     3 -> heft with Pnl instead of Plin
  #     4 -> heft with PnlxS instead of Plin
  ia_model: 0
  # Intrinsic alignment model
  #     0 -> zNLA
  #     1 -> TATT
  baryon_model: 0
  cross_sqrt_baryon: False
  # Baryonic flag
  #     0 -> no baryons
  #     1 -> Tagn HMcode
  #     2 -> bcemu
  #     3 -> bacco
  photoz_err_model: 0
  # Photo-z error on n(z) model
  #     0 -> no photo-z error
  #     1 -> additive mode, n(z') = n(z + dz)
  #     2 -> multiplicative mode, n(z') = n(z(1 + dz))
  params: ./ini_files/ini_data/params_data_gq.yaml

theory:
  add_noise: False
  nl_model: 12
  #bacco_option: 'z_extrap_hmcode'
  #Nonlinear power spectrum
  #     0 -> HMcode
  #     1 -> bacco
  #     2 -> nDGP
  #     3 -> gLEMURS
  #     4 -> μ-Σ (Σ is not properly implemented in Cls yet)
  #     5 -> Dark Scattering (Interacting Dark Energy)
  bias_model: 0
  # Photometric galaxy bias model (redshift dependence)
  #     0 -> linear interpolation
  #     1 -> constant within bins
  #     2 -> heft
  #     3 -> heft with Pnl
  #     4 -> heft with PnlxS
  ia_model: 0
  # Intrinsic alignment model
  #     0 -> zNLA
  #     1 -> TATT
  baryon_model: 0
  cross_sqrt_baryon: False
  # Baryonic flag
  #     0 -> no baryons
  #     1 -> Tagn HMcode
  #     2 -> bcemu
  #     3 -> bacco
  photoz_err_model: 0
  # Photo-z error on n(z) model
  #     0 -> no photo-z error
  #     1 -> additive mode, n(z') = n(z + dz)
  #     2 -> multiplicative mode, n(z') = n(z(1 + dz))
  params: ./ini_files/param_files/params_model_qg.yaml  

output: 
  chain_name: 3x2pt_euclid_gq_osc_noABpriors_data_qgosc_v2_varybeta
sampler: 
  mcmc:
    verbose: True
    n_eff: 1000
    n_live: 5000
    pool: 10
    resume: False
    hdf5_name:  3x2pt_euclid_gq_osc_noABpriors_data_qgosc_v2_varybeta
    
